buildscript {
    repositories {
        jcenter()
        maven {
            url = "https://maven.minecraftforge.net"
        }
    }
    dependencies {
        classpath "net.minecraftforge.gradle:ForgeGradle:${project.forge_gradle_version}"
    }
}
apply plugin: "net.minecraftforge.gradle"

version = project.mod_version
group = project.maven_group
archivesBaseName = project.archives_base_name

sourceCompatibility = targetCompatibility = project.java_version
compileJava {
    sourceCompatibility = targetCompatibility = project.java_version
}

minecraft {
    mappings channel: project.mappings_channel, version: project.mappings_version

    runs {
        client {
            workingDirectory project.file('run')
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft_version

    duplicatesStrategy = DuplicatesStrategy.INCLUDE

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'

        expand 'modid': project.mod_id, 'name': project.mod_name,
                'version': project.version, 'mcversion': project.minecraft_version,
                'author': project.mod_author, 'description': project.mod_description
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}
